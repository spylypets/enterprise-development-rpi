apiVersion: v1
kind: ConfigMap
metadata:
  name: flyway-migration-scripts
data:
  V1__initial_schema.sql: |
     DROP SCHEMA IF EXISTS collection CASCADE;
     CREATE SCHEMA collection;

     CREATE TABLE collection.items (
        id bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
        name varchar(255),
        summary varchar(1000),
        description text,
        country varchar(2),
        creation_year smallint,
        price numeric(10,2),
        small_image bigint,
        image bigint,
        topics varchar(255) array
     );

     CREATE TABLE collection.images (
        id bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
        file_name varchar(255)
     );

     INSERT INTO collection.images(file_name) values('juke-small.jpg');
     INSERT INTO collection.images(file_name) values('juke.jpg');
     INSERT INTO collection.images(file_name) values('penny-black-small.png');
     INSERT INTO collection.images(file_name) values('penny-black.png');
     INSERT INTO collection.images(file_name) values('juggling-juke-small.jpg');
     INSERT INTO collection.images(file_name) values('juggling-juke.jpg');

     INSERT INTO collection.items (name, summary, description, creation_year, country, price, small_image, image, topics) values('The Penny Black', 'The very first stamp', 'The very first post stamp but surprisingly not the most expensive one', 1840, 'uk', 1000, 3, 4, ARRAY['history']);
     INSERT INTO collection.items (name, summary, description, creation_year, country, price, small_image, image, topics) values('Juke', 'The Juke stature', 'Porcelain stature of Juke', 1996, 'us', 1000000, 1, 2, ARRAY['arts', 'programming']);
     INSERT INTO collection.items (name, summary, description, creation_year, country, price, small_image, image, topics) values('Juggling Juke', 'The Juggling Juke painting', 'Post modernist oil painting of the juggling Juke', 2000, 'us', 2000000, 5, 6, ARRAY['arts', 'programming']);