apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: collection-ingress
  labels:
    {{- include "collection-chart.labels" . | nindent 4 }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "collection-chart.name" . }}
                port:
                  number: {{ .Values.service.port }}