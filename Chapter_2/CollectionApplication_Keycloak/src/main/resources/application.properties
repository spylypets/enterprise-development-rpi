spring.application.name=CollectionApplication
server.port=8888

debug=false

spring.security.oauth2.resourceserver.jwt.jwkSetUri=https://localhost:8443/realms/collection/protocol/openid-connect/certs

spring.r2dbc.username=collector
spring.r2dbc.password=${DB_PASS}
spring.r2dbc.url=r2dbc:postgresql://${DB_HOST:localhost}:5432/collection
spring.sql.init.mode=never

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.password=${spring.r2dbc.password}
spring.flyway.user=${spring.r2dbc.username}
spring.flyway.url=jdbc:postgresql://${DB_HOST:localhost}:5432/collection
spring.flyway.default-schema=collection
spring.flyway.baseline-on-migrate=true






